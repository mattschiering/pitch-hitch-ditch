<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pitch, Hitch, or Ditch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Pitch, Hitch, or <span>Ditch</span></h1>
    <div id="teamHeader" class="team-header hidden"></div>
  </header>

  <main>
    <section id="viewJoin" class="panel">
      <h2>Join the game</h2>
      <label class="field">Game code
        <input id="joinCode" type="text" maxlength="6" placeholder="ABCDE" autocapitalize="characters" autocomplete="off">
      </label>
      <label class="field">Team name
        <input id="joinName" type="text" maxlength="24" placeholder="Team Awesome" autocomplete="off">
      </label>
      <p id="joinError" class="error"></p>
      <button class="btn primary big wide" id="btnJoin">Join</button>
    </section>

    <section id="viewGame" class="hidden"></section>
  </main>

  <div id="confetti"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="cards.js"></script>
  <script src="common.js"></script>
  <script src="student.js"></script>
</body>
</html>
